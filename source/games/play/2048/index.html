<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>2048</title>
<style>
  :root {
    --bg: #0b1117;
    --panel: #141d26;
    --slot: #1b2733;
    --line: #233240;
    --fg: #e3eaf1;
    --dim: #8798a8;
    --amber: #e8b04b;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #16212c 0%, #0b1117 72%);
    color: var(--fg);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    gap: 9px;
    align-items: center;
    width: 100%;
    max-width: 470px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 10px;
  }

  .brand {
    font-size: 1rem;
    letter-spacing: .2em;
    color: var(--amber);
  }

  .stats { display: flex; gap: 8px; }

  .stat {
    min-width: 68px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    text-align: center;
  }

  .stat .label {
    display: block;
    font-size: .58rem;
    letter-spacing: .12em;
    color: var(--dim);
  }

  .stat .value {
    display: block;
    font-size: .95rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 10px;
  }

  .hint {
    font-size: .64rem;
    line-height: 1.5;
    color: var(--dim);
  }

  .btns { display: flex; gap: 6px; }

  button {
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    font-family: inherit;
    font-size: .7rem;
    line-height: 1.4;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }

  button:hover { border-color: var(--amber); background: #1a2530; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--line); background: var(--panel); }

  .board {
    position: relative;
    width: min(420px, 86vw, 54vh);
    aspect-ratio: 1;
    padding: var(--gap, 10px);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--slot);
    touch-action: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap, 10px);
    width: 100%;
    height: 100%;
  }

  .slot {
    border-radius: 8px;
    background: #1f2c39;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .03);
  }

  .tiles {
    position: absolute;
    inset: var(--gap, 10px);
  }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--cell-px, 70px);
    height: var(--cell-px, 70px);
    left: calc((var(--cell-px, 70px) + var(--gap, 10px)) * var(--c, 0));
    top: calc((var(--cell-px, 70px) + var(--gap, 10px)) * var(--r, 0));
    border-radius: 8px;
    background: #2b3a49;
    font-weight: 700;
    font-size: calc(var(--cell-px, 70px) * .34);
    line-height: 1;
    transition: left .1s ease, top .1s ease, background .1s ease, color .1s ease;
  }

  .tile.v2 { background: #e9edf1; color: #26313d; }
  .tile.v4 { background: #dee5eb; color: #26313d; }
  .tile.v8 { background: #f2c48b; color: #2b2116; }
  .tile.v16 { background: #eea55f; color: #2b2116; }
  .tile.v32 { background: #e8864a; color: #fff; }
  .tile.v64 { background: #dd653c; color: #fff; }
  .tile.v128 { background: #6fc3b1; color: #08221d; font-size: calc(var(--cell-px, 70px) * .27); }
  .tile.v256 { background: #4fae9b; color: #f2fffb; font-size: calc(var(--cell-px, 70px) * .27); }
  .tile.v512 { background: #3a9684; color: #f2fffb; font-size: calc(var(--cell-px, 70px) * .27); }
  .tile.v1024 { background: #e8b04b; color: #241a06; font-size: calc(var(--cell-px, 70px) * .2); }
  .tile.v2048 { background: #f2c94c; color: #241a06; font-size: calc(var(--cell-px, 70px) * .2); box-shadow: 0 0 22px rgba(242, 201, 76, .55); }
  .tile.vbig { background: #f7e689; color: #241a06; font-size: calc(var(--cell-px, 70px) * .18); box-shadow: 0 0 26px rgba(247, 230, 137, .6); }

  .tile.is-new { animation: appear .16s ease; }
  .tile.is-merge { animation: bump .16s ease; }

  @keyframes appear {
    from { transform: scale(.55); opacity: .5; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes bump {
    0% { transform: scale(1); }
    45% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border-radius: 12px;
    background: rgba(11, 17, 23, .84);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }

  .overlay.show { display: flex; }

  .overlay-text {
    font-size: .95rem;
    letter-spacing: .14em;
    color: var(--amber);
  }

  .overlay-btns { display: flex; gap: 8px; }

  @media (max-height: 520px) {
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">2048</span>
    <span class="stats">
      <span class="stat"><span class="label">得分</span><span class="value" id="score">0</span></span>
      <span class="stat"><span class="label">纪录</span><span class="value" id="best">0</span></span>
    </span>
  </div>

  <div class="bar">
    <span class="hint">方向键 / WASD 移动，触屏滑动</span>
    <span class="btns">
      <button type="button" id="undo">撤销</button>
      <button type="button" id="restart">重开</button>
    </span>
  </div>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <span class="overlay-text" id="overlayText"></span>
      <span class="overlay-btns">
        <button type="button" id="btnSecondary">撤销一步</button>
        <button type="button" id="btnPrimary">重新开始</button>
      </span>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var N = 4;
  var BEST_KEY = 'wwhai.games.2048.best';

  var board = document.getElementById('board');
  var gridEl = document.getElementById('grid');
  var tilesEl = document.getElementById('tiles');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayText = document.getElementById('overlayText');
  var btnPrimary = document.getElementById('btnPrimary');
  var btnSecondary = document.getElementById('btnSecondary');
  var undoBtn = document.getElementById('undo');
  var restartBtn = document.getElementById('restart');

  var grid = [];
  var tiles = [];
  var score = 0;
  var best = 0;
  var won = false;
  var over = false;
  var history = [];
  var uid = 0;
  var secondaryAction = 'undo';

  var DIRS = {
    up: { dr: -1, dc: 0 },
    down: { dr: 1, dc: 0 },
    left: { dr: 0, dc: -1 },
    right: { dr: 0, dc: 1 }
  };

  function loadBest() {
    try {
      best = parseInt(window.localStorage.getItem(BEST_KEY), 10) || 0;
    } catch (e) {
      best = 0;
    }
    bestEl.textContent = best;
  }

  function saveBest() {
    if (score <= best) return;
    best = score;
    bestEl.textContent = best;
    try {
      window.localStorage.setItem(BEST_KEY, String(best));
    } catch (e) {}
  }

  function measure() {
    var width = board.clientWidth;
    if (!width) return;
    var gap = Math.max(6, Math.round(width * 0.024));
    var cell = (width - gap * 5) / 4;
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--cell-px', cell + 'px');
    tilesEl.style.setProperty('--gap', gap + 'px');
    tilesEl.style.setProperty('--cell-px', cell + 'px');
  }

  function emptyGrid() {
    grid = [];
    for (var r = 0; r < N; r++) {
      var row = [];
      for (var c = 0; c < N; c++) row.push(null);
      grid.push(row);
    }
  }

  function clearTiles() {
    tiles = [];
    tilesEl.innerHTML = '';
  }

  function paint(tile) {
    var el = tile.el;
    el.className = 'tile ' + (tile.value > 2048 ? 'vbig' : 'v' + tile.value);
    el.textContent = tile.value;
    el.style.setProperty('--r', tile.r);
    el.style.setProperty('--c', tile.c);
  }

  function flash(tile, cls) {
    if (!tile.el) return;
    tile.el.classList.add(cls);
    window.setTimeout(function () {
      if (tile.el) tile.el.classList.remove(cls);
    }, 200);
  }

  function createTile(r, c, value) {
    var el = document.createElement('div');
    tilesEl.appendChild(el);
    var tile = { id: ++uid, r: r, c: c, value: value, el: el, merged: false };
    grid[r][c] = tile;
    tiles.push(tile);
    paint(tile);
    return tile;
  }

  function spawn(count) {
    for (var i = 0; i < count; i++) {
      var cells = [];
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          if (!grid[r][c]) cells.push({ r: r, c: c });
        }
      }
      if (!cells.length) return;
      var pick = cells[Math.floor(Math.random() * cells.length)];
      var tile = createTile(pick.r, pick.c, Math.random() < 0.9 ? 2 : 4);
      flash(tile, 'is-new');
    }
  }

  function snapshot() {
    return {
      score: score,
      won: won,
      cells: tiles.map(function (t) {
        return { r: t.r, c: t.c, value: t.value };
      })
    };
  }

  function updateUndo() {
    undoBtn.disabled = history.length === 0;
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function showOverlay(text, secondary) {
    overlayText.textContent = text;
    secondaryAction = secondary;
    btnSecondary.textContent = secondary === 'continue' ? '继续' : '撤销一步';
    btnSecondary.disabled = secondary === 'continue' ? false : history.length === 0;
    overlay.classList.add('show');
  }

  function newGame() {
    clearTiles();
    emptyGrid();
    score = 0;
    won = false;
    over = false;
    history = [];
    scoreEl.textContent = '0';
    hideOverlay();
    spawn(2);
    updateUndo();
  }

  function canMove() {
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var tile = grid[r][c];
        if (!tile) return true;
        if (c + 1 < N && grid[r][c + 1] && grid[r][c + 1].value === tile.value) return true;
        if (r + 1 < N && grid[r + 1][c] && grid[r + 1][c].value === tile.value) return true;
      }
    }
    return false;
  }

  function inside(r, c) {
    return r >= 0 && r < N && c >= 0 && c < N;
  }

  function farthest(tile, vec) {
    var r = tile.r;
    var c = tile.c;
    var nr = r + vec.dr;
    var nc = c + vec.dc;
    while (inside(nr, nc) && !grid[nr][nc]) {
      r = nr;
      c = nc;
      nr += vec.dr;
      nc += vec.dc;
    }
    return { r: r, c: c };
  }

  function move(dir) {
    if (over || overlay.classList.contains('show')) return;

    var vec = DIRS[dir];
    var rows = [0, 1, 2, 3];
    var cols = [0, 1, 2, 3];
    if (vec.dr > 0) rows = [3, 2, 1, 0];
    if (vec.dc > 0) cols = [3, 2, 1, 0];

    var snap = snapshot();
    var moved = false;
    var gained = 0;
    var merged = [];
    var eaten = [];

    tiles.forEach(function (t) { t.merged = false; });

    for (var i = 0; i < rows.length; i++) {
      for (var j = 0; j < cols.length; j++) {
        var r = rows[i];
        var c = cols[j];
        var tile = grid[r][c];
        if (!tile) continue;

        var far = farthest(tile, vec);
        var nr = far.r + vec.dr;
        var nc = far.c + vec.dc;
        var target = inside(nr, nc) ? grid[nr][nc] : null;

        if (target && !target.merged && target.value === tile.value) {
          target.merged = true;
          target.value = tile.value * 2;
          gained += target.value;
          grid[r][c] = null;
          eaten.push(tile);
          merged.push(target);
          moved = true;
          if (target.value === 2048 && !won) {
            won = true;
            showOverlay('达到 2048', 'continue');
          }
        } else if (far.r !== r || far.c !== c) {
          grid[r][c] = null;
          grid[far.r][far.c] = tile;
          tile.r = far.r;
          tile.c = far.c;
          moved = true;
        }
      }
    }

    if (!moved) return;

    eaten.forEach(function (t) {
      if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el);
      var index = tiles.indexOf(t);
      if (index > -1) tiles.splice(index, 1);
    });

    tiles.forEach(paint);
    merged.forEach(function (t) { flash(t, 'is-merge'); });

    score += gained;
    scoreEl.textContent = score;
    saveBest();

    history.push(snap);
    if (history.length > 1) history.shift();
    updateUndo();

    spawn(1);

    if (!canMove()) {
      over = true;
      showOverlay('无路可走', 'undo');
    }
  }

  function restore(snap) {
    clearTiles();
    emptyGrid();
    score = snap.score;
    won = snap.won;
    over = false;
    scoreEl.textContent = score;
    snap.cells.forEach(function (cell) {
      createTile(cell.r, cell.c, cell.value);
    });
    hideOverlay();
  }

  function undo() {
    if (!history.length) return;
    restore(history.pop());
    updateUndo();
  }

  var KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right',
    k: 'up', K: 'up', j: 'down', J: 'down', h: 'left', H: 'left', l: 'right', L: 'right'
  };

  function notifyClose() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage('games-close', window.location.origin);
      } catch (e) {}
    }
  }

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      notifyClose();
      return;
    }
    var dir = KEYMAP[event.key];
    if (!dir) return;
    event.preventDefault();
    move(dir);
  }, { passive: false });

  var touchX = 0;
  var touchY = 0;
  var tracking = false;

  board.addEventListener('touchstart', function (event) {
    if (event.touches.length !== 1) return;
    tracking = true;
    touchX = event.touches[0].clientX;
    touchY = event.touches[0].clientY;
  }, { passive: true });

  board.addEventListener('touchend', function (event) {
    if (!tracking) return;
    tracking = false;
    var touch = event.changedTouches[0];
    var dx = touch.clientX - touchX;
    var dy = touch.clientY - touchY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    event.preventDefault();
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: false });

  undoBtn.addEventListener('click', undo);
  restartBtn.addEventListener('click', newGame);
  btnPrimary.addEventListener('click', newGame);
  btnSecondary.addEventListener('click', function () {
    if (secondaryAction === 'continue') {
      hideOverlay();
    } else {
      undo();
    }
  });

  (function buildSlots() {
    var fragment = document.createDocumentFragment();
    for (var i = 0; i < N * N; i++) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      fragment.appendChild(slot);
    }
    gridEl.appendChild(fragment);
  })();

  measure();
  loadBest();
  emptyGrid();
  newGame();

  if (window.ResizeObserver) {
    new window.ResizeObserver(measure).observe(board);
  } else {
    window.addEventListener('resize', measure);
  }
})();
</script>
</body>
</html>
