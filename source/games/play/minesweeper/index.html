<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>扫雷</title>
<style>
  :root {
    --panel: #141d26;
    --cover: #22313f;
    --cover-top: #2b3d4d;
    --line: #233240;
    --fg: #e3eaf1;
    --dim: #8798a8;
    --amber: #e8b04b;
    --red: #e06c75;
    --green: #4fb6a5;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #16212c 0%, #0b1117 72%);
    color: var(--fg);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 9px;
    align-items: center;
    width: 100%;
    max-width: 560px;
  }

  .topbar, .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 10px;
  }

  .brand {
    font-size: 1rem;
    letter-spacing: .2em;
    color: var(--amber);
    white-space: nowrap;
  }

  .levels { display: flex; gap: 6px; }

  .level {
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--dim);
    font-family: inherit;
    font-size: .68rem;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }

  .level:hover { color: var(--fg); border-color: #3a4d5f; }
  .level.on { color: #0b1117; background: var(--amber); border-color: var(--amber); }

  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    font-size: .68rem;
    color: var(--dim);
  }

  .status b { color: var(--fg); font-weight: 700; }

  .restart {
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    font-family: inherit;
    font-size: .68rem;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }

  .restart:hover { border-color: var(--amber); background: #1a2530; }

  .stage {
    width: 100%;
    max-width: 100%;
    overflow: auto;
  }

  .board {
    display: grid;
    gap: 2px;
    padding: 6px;
    margin: 0 auto;
    width: max-content;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #121a23;
    touch-action: manipulation;
  }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--cell, 20px);
    height: var(--cell, 20px);
    border-radius: 3px;
    background: linear-gradient(180deg, var(--cover-top) 0%, var(--cover) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 1px 2px rgba(0, 0, 0, .35);
    font-size: calc(var(--cell, 20px) * .6);
    font-weight: 700;
    line-height: 1;
    color: #cfe0ee;
    cursor: pointer;
  }

  .cell:hover { background: linear-gradient(180deg, #33465a 0%, #283846 100%); }

  .cell.open {
    background: #17212b;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04);
    cursor: default;
  }

  .cell.open:hover { background: #17212b; }

  .cell.n1 { color: #6f9fd8; }
  .cell.n2 { color: #5fb98a; }
  .cell.n3 { color: #e0a04a; }
  .cell.n4 { color: #d9705f; }
  .cell.n5 { color: #b98bd8; }
  .cell.n6 { color: #5caac4; }
  .cell.n7 { color: #c9d5e0; }
  .cell.n8 { color: #8d9aa8; }

  .cell.flag::before {
    content: "";
    position: absolute;
    left: 46%;
    top: 20%;
    width: .1em;
    height: .62em;
    background: var(--red);
    transform: translateX(-50%);
  }

  .cell.flag::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 20%;
    border-top: .16em solid transparent;
    border-bottom: .16em solid transparent;
    border-left: .3em solid var(--red);
  }

  .cell.boom {
    background: #402028;
    box-shadow: inset 0 0 0 1px rgba(224, 108, 117, .5);
  }

  .cell.boom::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: .44em;
    height: .44em;
    border-radius: 50%;
    background: radial-gradient(circle, #ffd9a8 0%, #e06c75 55%, #7a2f34 100%);
    transform: translate(-50%, -50%);
  }

  .cell.wrong {
    background: #2a2229;
  }

  .cell.wrong::after {
    content: "";
    position: absolute;
    inset: 18%;
    border-top: .1em solid rgba(224, 108, 117, .85);
    border-left: .1em solid rgba(224, 108, 117, .85);
    transform: rotate(45deg);
  }

  .overlay {
    position: absolute;
    inset: -6px;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border-radius: 12px;
    background: rgba(11, 17, 23, .84);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }

  .overlay.show { display: flex; }

  .overlay-title {
    font-size: .95rem;
    letter-spacing: .14em;
    color: var(--amber);
  }

  .overlay-meta { font-size: .72rem; color: var(--dim); }

  .overlay button {
    padding: 5px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    font-family: inherit;
    font-size: .74rem;
    cursor: pointer;
  }

  .overlay button:hover { border-color: var(--amber); }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <span class="brand">扫雷</span>
    <span class="levels" id="levels">
      <button type="button" class="level on" data-level="0">初级</button>
      <button type="button" class="level" data-level="1">中级</button>
      <button type="button" class="level" data-level="2">高级</button>
      <button type="button" class="level restart" id="restart">重开</button>
    </span>
  </div>

  <div class="status">
    <span>雷 <b id="left">10</b></span>
    <span>用时 <b id="time">0</b> 秒</span>
  </div>

  <div class="stage" id="stage">
    <div class="board" id="board"></div>
  </div>

  <div class="overlay" id="overlay">
    <span class="overlay-title" id="ovTitle"></span>
    <span class="overlay-meta" id="ovMeta"></span>
    <button type="button" id="ovBtn">再来一局</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var LEVELS = [
    { cols: 9, rows: 9, mines: 10 },
    { cols: 16, rows: 16, mines: 40 },
    { cols: 30, rows: 16, mines: 99 }
  ];

  var board = document.getElementById('board');
  var stage = document.getElementById('stage');
  var leftEl = document.getElementById('left');
  var timeEl = document.getElementById('time');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovMeta = document.getElementById('ovMeta');

  var level = 0;
  var cols = 0;
  var rows = 0;
  var mines = 0;
  var cells = [];
  var nodes = [];
  var flags = 0;
  var opened = 0;
  var started = false;
  var finished = false;
  var timer = 0;
  var seconds = 0;
  var pressTimer = null;
  var pressIndex = -1;

  function index(r, c) { return r * cols + c; }

  function fit() {
    var maxW = (stage.clientWidth || window.innerWidth) - 8;
    var maxH = window.innerHeight - 150;
    var byWidth = (maxW - 12 - 2 * cols) / cols;
    var byHeight = (maxH - 12 - 2 * rows) / rows;
    var cell = Math.floor(Math.min(byWidth, byHeight, 34));
    if (cell < 12) cell = 12;
    board.style.setProperty('--cell', cell + 'px');
  }

  function buildCell(r, c) {
    var node = document.createElement('div');
    node.className = 'cell';
    node.setAttribute('data-r', r);
    node.setAttribute('data-c', c);
    board.appendChild(node);
    nodes[index(r, c)] = node;
  }

  function newGame() {
    var conf = LEVELS[level];
    cols = conf.cols;
    rows = conf.rows;
    mines = conf.mines;
    flags = 0;
    opened = 0;
    started = false;
    finished = false;
    seconds = 0;
    cells = [];
    nodes = [];

    window.clearInterval(timer);
    timer = 0;

    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + cols + ', var(--cell))';
    fit();

    for (var r = 0; r < rows; r++) {
      var row = [];
      for (var c = 0; c < cols; c++) {
        row.push({ mine: false, open: false, flag: false, count: 0 });
        buildCell(r, c);
      }
      cells.push(row);
    }

    leftEl.textContent = mines;
    timeEl.textContent = '0';
    overlay.classList.remove('show');
  }

  function neighbors(r, c) {
    var out = [];
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        var nr = r + dr;
        var nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push(cells[nr][nc]);
      }
    }
    return out;
  }

  function plantMines(safeR, safeC) {
    var safe = [];
    safe.push({ r: safeR, c: safeC });
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        safe.push({ r: safeR + dr, c: safeC + dc });
      }
    }

    var positions = [];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var blocked = false;
        for (var i = 0; i < safe.length; i++) {
          if (safe[i].r === r && safe[i].c === c) { blocked = true; break; }
        }
        if (!blocked) positions.push({ r: r, c: c });
      }
    }

    for (var n = 0; n < mines && positions.length; n++) {
      var pick = Math.floor(Math.random() * positions.length);
      var pos = positions.splice(pick, 1)[0];
      cells[pos.r][pos.c].mine = true;
    }

    for (var rr = 0; rr < rows; rr++) {
      for (var cc = 0; cc < cols; cc++) {
        if (cells[rr][cc].mine) continue;
        cells[rr][cc].count = neighbors(rr, cc).filter(function (item) { return item.mine; }).length;
      }
    }
  }

  function startTimer() {
    started = true;
    timer = window.setInterval(function () {
      seconds += 1;
      timeEl.textContent = seconds;
    }, 1000);
  }

  function paintCell(r, c) {
    var cell = cells[r][c];
    var node = nodes[index(r, c)];
    if (!node) return;

    node.className = 'cell';
    node.textContent = '';

    if (cell.open) {
      node.classList.add('open');
      if (cell.mine) {
        node.classList.add('boom');
      } else if (cell.count > 0) {
        node.classList.add('n' + cell.count);
        node.textContent = cell.count;
      }
    } else if (cell.flag) {
      node.classList.add('flag');
    }
  }

  function reveal(r, c) {
    if (finished) return;
    var cell = cells[r][c];
    if (!cell || cell.open || cell.flag) return;

    if (!started) {
      plantMines(r, c);
      startTimer();
    }

    if (cell.mine) {
      lose(r, c);
      return;
    }

    var stack = [{ r: r, c: c }];
    while (stack.length) {
      var item = stack.pop();
      var target = cells[item.r][item.c];
      if (target.open || target.flag || target.mine) continue;
      target.open = true;
      opened += 1;
      paintCell(item.r, item.c);
      if (target.count === 0) {
        for (var dr = -1; dr <= 1; dr++) {
          for (var dc = -1; dc <= 1; dc++) {
            var nr = item.r + dr;
            var nc = item.c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            if (cells[nr][nc].open || cells[nr][nc].flag || cells[nr][nc].mine) continue;
            stack.push({ r: nr, c: nc });
          }
        }
      }
    }

    if (!finished) checkWin();
  }

  function toggleFlag(r, c) {
    if (finished) return;
    var cell = cells[r][c];
    if (!cell || cell.open) return;
    cell.flag = !cell.flag;
    flags += cell.flag ? 1 : -1;
    leftEl.textContent = mines - flags;
    paintCell(r, c);
  }

  function chord(r, c) {
    var cell = cells[r][c];
    if (!cell || !cell.open || cell.count === 0) return;
    var list = neighbors(r, c);
    var marked = list.filter(function (item) { return item.flag; }).length;
    if (marked !== cell.count) return;
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        var rr = r + dr;
        var cc = c + dc;
        if (rr < 0 || rr >= rows || cc < 0 || cc >= cols) continue;
        var item = cells[rr][cc];
        if (item.open || item.flag) continue;
        reveal(rr, cc);
      }
    }
  }

  function checkWin() {
    if (opened === rows * cols - mines) {
      finished = true;
      window.clearInterval(timer);
      overlay.classList.add('show');
      ovTitle.textContent = '雷区清理完毕';
      ovMeta.textContent = '用时 ' + seconds + ' 秒';
    }
  }

  function lose(r, c) {
    finished = true;
    window.clearInterval(timer);

    for (var rr = 0; rr < rows; rr++) {
      for (var cc = 0; cc < cols; cc++) {
        var cell = cells[rr][cc];
        var node = nodes[index(rr, cc)];
        if (cell.mine && !cell.flag) {
          node.className = 'cell open boom';
        } else if (!cell.mine && cell.flag) {
          node.className = 'cell open wrong';
        }
      }
    }

    nodes[index(r, c)].className = 'cell open boom';
    overlay.classList.add('show');
    ovTitle.textContent = '踩雷了';
    ovMeta.textContent = '用时 ' + seconds + ' 秒';
  }

  function cellOf(event) {
    var el = event.target;
    if (!el || !el.getAttribute) return null;
    var r = el.getAttribute('data-r');
    var c = el.getAttribute('data-c');
    if (r === null || c === null) return null;
    return { r: parseInt(r, 10), c: parseInt(c, 10) };
  }

  board.addEventListener('contextmenu', function (event) {
    event.preventDefault();
  });

  board.addEventListener('mousedown', function (event) {
    var pos = cellOf(event);
    if (!pos) return;
    if (event.button === 2) {
      event.preventDefault();
      toggleFlag(pos.r, pos.c);
    } else if (event.button === 1) {
      event.preventDefault();
      chord(pos.r, pos.c);
    }
  });

  board.addEventListener('click', function (event) {
    if (pressIndex > -1) {
      pressIndex = -1;
      return;
    }
    var pos = cellOf(event);
    if (!pos) return;
    reveal(pos.r, pos.c);
  });

  board.addEventListener('dblclick', function (event) {
    var pos = cellOf(event);
    if (!pos) return;
    chord(pos.r, pos.c);
  });

  board.addEventListener('pointerdown', function (event) {
    if (event.pointerType === 'mouse') return;
    var pos = cellOf(event);
    if (!pos) return;
    pressIndex = -1;
    window.clearTimeout(pressTimer);
    pressTimer = window.setTimeout(function () {
      pressIndex = index(pos.r, pos.c);
      toggleFlag(pos.r, pos.c);
    }, 450);
  });

  board.addEventListener('pointerup', function () {
    window.clearTimeout(pressTimer);
  });

  board.addEventListener('pointercancel', function () {
    window.clearTimeout(pressTimer);
  });

  document.getElementById('restart').addEventListener('click', newGame);
  document.getElementById('ovBtn').addEventListener('click', newGame);

  document.getElementById('levels').addEventListener('click', function (event) {
    var el = event.target;
    if (!el || !el.getAttribute || !el.getAttribute('data-level')) return;
    level = parseInt(el.getAttribute('data-level'), 10);
    var buttons = document.querySelectorAll('.level');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('on', i === level);
    }
    newGame();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && window.parent && window.parent !== window) {
      try { window.parent.postMessage('games-close', window.location.origin); } catch (e) {}
    }
  });

  window.addEventListener('resize', fit);

  newGame();
})();
</script>
</body>
</html>
